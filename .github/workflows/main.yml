name: Build akmenu-next

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.25.0@sha256:c5f19b95d9c2f312e6a68ea244d2ed5120203b4b82af9785937a349096f8e5e4
    name: Build with Docker using BlocksDS 1.25.0

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zip

      - name: Show toolchain versions
        run: |
          wf-pacman -Q blocksds-toolchain toolchain-gcc-arm-none-eabi-gcc toolchain-gcc-arm-none-eabi-binutils toolchain-gcc-arm-none-eabi-picolibc-generic toolchain-gcc-arm-none-eabi-libstdcxx-picolibc
          cat "$BLOCKSDS/version.txt"

      - name: Silence all git safe directory warnings
        run: git config --system --add safe.directory '*'

      - name: Set workspace permissions
        run: chmod 777 -R "$GITHUB_WORKSPACE"

      - name: Build akmenu-next
        shell: bash
        run: |
          make -j$(nproc) VERBOSE=1 2>&1 | tee build.log

      - name: Check build log for devkitPro leakage
        shell: bash
        run: |
          if grep -inE 'devkitpro|devkitarm|ds_rules|-lfat' build.log; then
            echo "devkitPro reference found in build log"
            exit 1
          fi

      - name: Run package script
        run: |
          cd package
          chmod +x package.sh
          ./package.sh

      - name: Upload akmenu-next-flashcart
        uses: actions/upload-artifact@v4
        with:
          name: akmenu-next-flashcart
          path: package/akmenu-next-flashcart.zip

      - name: Upload akmenu-next-dsi
        uses: actions/upload-artifact@v4
        with:
          name: akmenu-next-dsi
          path: package/akmenu-next-dsi.zip

      - name: Upload akmenu-next-3ds
        uses: actions/upload-artifact@v4
        with:
          name: akmenu-next-3ds
          path: package/akmenu-next-3ds.zip

      - name: Upload akmenu-next-pico
        uses: actions/upload-artifact@v4
        with:
          name: akmenu-next-pico
          path: package/akmenu-next-pico.zip